<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>買取差益チェッカー</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;
  --accent:#d6362c;--accent-ink:#fff;--plus:#0f8a4b;--plus-bg:#e6f4ec;--minus:#b42318;
  --chip:#f0eee9;--warn:#a15c00;--warn-bg:#fff4e0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1e1e1c;--ink:#ecebe7;--sub:#9d9b95;--line:#33322f;
  --accent:#ff5a4e;--accent-ink:#141413;--plus:#4cd38a;--plus-bg:#16301f;--minus:#ff7b6e;
  --chip:#2a2a27;--warn:#ffb648;--warn-bg:#33270f;}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1e1e1c;--ink:#ecebe7;--sub:#9d9b95;--line:#33322f;
  --accent:#ff5a4e;--accent-ink:#141413;--plus:#4cd38a;--plus-bg:#16301f;--minus:#ff7b6e;
  --chip:#2a2a27;--warn:#ffb648;--warn-bg:#33270f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
a{color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0;font-size:20px;letter-spacing:.02em}
h1 b{color:var(--accent)}
.meta{color:var(--sub);font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta .err{color:var(--minus)}
main{padding:16px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
aside.panel{position:sticky;top:12px}
@media(max-width:860px){aside.panel{position:static}}
fieldset{border:0;margin:0 0 14px;padding:0}
legend{font-weight:700;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.04em}
label{display:flex;align-items:center;gap:6px;margin:4px 0;cursor:pointer}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=number],input[type=text],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit;width:100%}
input[type=number]{width:78px}
.row input[type=number]{flex:0 0 auto}
.hint{font-size:11px;color:var(--sub);margin-top:2px}
.btns{display:flex;gap:6px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.count{color:var(--sub)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:64px 1fr 150px;gap:12px}
@media(max-width:600px){.item{grid-template-columns:52px 1fr}.profit{grid-column:1/-1}}
.item img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:6px}
@media(max-width:600px){.item img{width:52px;height:52px}}
.name{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.jan{font-size:11px;color:var(--sub);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;text-decoration:none;white-space:nowrap}
.chip.best{background:var(--ink);color:var(--panel)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.offer{font-size:12px;color:var(--sub)}
.offer a{color:var(--ink);font-weight:600}
.profit{text-align:right;display:flex;flex-direction:column;justify-content:center;gap:2px}
.profit .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.plus{color:var(--plus)}.minus{color:var(--minus)}
.profit .r{font-size:12px;color:var(--sub)}
.profit .buy{display:inline-block;margin-top:4px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:5px 10px;text-decoration:none;font-weight:700;font-size:12px}
details{grid-column:2/-1}
@media(max-width:600px){details{grid-column:1/-1}}
summary{cursor:pointer;font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
td,th{padding:4px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left;white-space:normal}
.more{margin:14px auto;display:block}
.more[hidden]{display:none}
.empty{padding:40px;text-align:center;color:var(--sub)}
.calc{font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>買取<b>差益</b>チェッカー</h1>
  <div class="meta" id="meta">読み込み中…</div>
</div></header>
<main><div class="wrap layout">
<aside class="panel" id="settings">
  <fieldset>
    <legend>ポイント還元（Yahoo!ショッピング）</legend>
    <div class="row">PayPayステップ等 <input type="number" id="step" step="0.5" min="0"> %</div>
    <div class="row">キャンペーン上乗せ <input type="number" id="extra" step="0.5" min="0"> %</div>
    <div class="hint">5のつく日・ボーナスストア等の合計を入力。ストア独自ポイントは自動で加算</div>
    <label><input type="checkbox" id="premium"> LYPプレミアム価格・ポイントで計算</label>
    <div class="row">ポイントの評価 <input type="number" id="ptval" step="5" min="0" max="100"> %</div>
    <div class="hint">期間限定ポイントを1P=1円未満で見るなら下げる</div>
  </fieldset>
  <fieldset>
    <legend>クーポン</legend>
    <div class="row">
      <select id="cpType" style="width:auto"><option value="none">なし</option><option value="pct">％引き</option><option value="yen">円引き</option></select>
      <input type="number" id="cpVal" min="0">
    </div>
    <div class="row">条件 <input type="number" id="cpMin" min="0">円以上 上限<input type="number" id="cpCap" min="0">円</div>
  </fieldset>
  <fieldset>
    <legend>コスト</legend>
    <div class="row">送料無料以外の想定送料 <input type="number" id="shipAdd" min="0" step="100"> 円</div>
    <div class="row">買取店への発送費 <input type="number" id="sendCost" min="0" step="100"> 円</div>
  </fieldset>
  <fieldset>
    <legend>買取店</legend>
    <div id="srcBoxes"></div>
  </fieldset>
  <fieldset>
    <legend>絞り込み</legend>
    <input type="text" id="q" placeholder="商品名・JAN・ストア名">
    <div class="row" style="margin-top:6px">お得額 <input type="number" id="minProfit" step="100"> 円以上</div>
    <div class="row">買取価格 <input type="number" id="minBuy" step="1000"> 円以上</div>
    <label><input type="checkbox" id="freeOnly"> 送料無料のみ</label>
    <label><input type="checkbox" id="noProof"> 購入証明が必要な商品を除く</label>
  </fieldset>
  <div class="btns"><button id="reset">初期値に戻す</button><button id="theme">表示切替</button></div>
</aside>
<section>
  <div class="toolbar">
    <div class="btns" id="sortBtns">
      <button data-sort="profit" class="on">お得額順</button>
      <button data-sort="rate">お得率順</button>
      <button data-sort="buy">買取価格順</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>さらに表示</button>
</section>
</div></main>
<script>
const DEFAULTS={step:8,extra:0,premium:false,ptval:100,cpType:'none',cpVal:0,cpMin:0,cpCap:0,
  shipAdd:800,sendCost:0,q:'',minProfit:0,minBuy:0,freeOnly:false,noProof:false,sort:'profit',srcOff:[]};
const store={get(){try{return JSON.parse(localStorage.getItem('kts')||'{}')}catch(e){return {}}},
  set(v){try{localStorage.setItem('kts',JSON.stringify(v))}catch(e){}}};
let S={...DEFAULTS,...store.get()};
let DATA=null,shown=100;
const $=id=>document.getElementById(id);
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NUMS=['step','extra','ptval','cpVal','cpMin','cpCap','shipAdd','sendCost','minProfit','minBuy'];
const BOOLS=['premium','freeOnly','noProof'];
function syncForm(){
  NUMS.forEach(k=>$(k).value=S[k]);BOOLS.forEach(k=>$(k).checked=S[k]);
  $('cpType').value=S.cpType;$('q').value=S.q;
  document.querySelectorAll('#sortBtns button').forEach(b=>b.classList.toggle('on',b.dataset.sort===S.sort));
  document.querySelectorAll('#srcBoxes input').forEach(c=>c.checked=!S.srcOff.includes(c.value));
}
function readForm(){
  NUMS.forEach(k=>S[k]=parseFloat($(k).value)||0);BOOLS.forEach(k=>S[k]=$(k).checked);
  S.cpType=$('cpType').value;S.q=$('q').value.trim();
  S.srcOff=[...document.querySelectorAll('#srcBoxes input')].filter(c=>!c.checked).map(c=>c.value);
  store.set(S);shown=100;render();
}

// 1つの出品について実質価格を計算
function evalOffer(o){
  const base=(S.premium&&o.pp>0)?o.pp:o.p;
  let cp=0;
  if(S.cpType!=='none'&&base>=S.cpMin){
    cp=S.cpType==='pct'?Math.floor(base*S.cpVal/100):S.cpVal;
    if(S.cpCap>0)cp=Math.min(cp,S.cpCap);
  }
  const paid=base-cp;
  const ship=o.sh===2?0:S.shipAdd;
  const storePt=(S.premium&&o.ptp>0)?o.ptp:o.pt;
  const userPt=Math.floor(paid/1.1*(S.step+S.extra)/100); // ポイントは税抜価格に付与
  const pts=storePt+userPt;
  const eff=paid+ship-pts*S.ptval/100;
  return {o,base,cp,paid,ship,storePt,userPt,pts,eff};
}

function compute(){
  const srcs=Object.keys(DATA.sources).filter(k=>!S.srcOff.includes(k));
  const q=S.q.toLowerCase();
  const rows=[];
  for(const it of DATA.items){
    const buys=srcs.map(k=>it.buys[k]&&{k,...it.buys[k]}).filter(Boolean);
    if(!buys.length)continue;
    if(S.noProof&&buys.every(b=>b.note))continue;
    const pool=S.noProof?buys.filter(b=>!b.note):buys;
    const best=pool.reduce((a,b)=>b.p>a.p?b:a);
    if(best.p<S.minBuy)continue;
    let offers=it.offers.map(evalOffer);
    if(S.freeOnly)offers=offers.filter(e=>e.o.sh===2);
    if(!offers.length)continue;
    offers.sort((a,b)=>a.eff-b.eff);
    const top=offers[0];
    const profit=best.p-top.eff-S.sendCost;
    if(profit<S.minProfit)continue;
    if(q&&!(it.name.toLowerCase().includes(q)||it.jan.includes(q)||offers.some(e=>e.o.s.toLowerCase().includes(q)||e.o.n.toLowerCase().includes(q))))continue;
    rows.push({it,buys,best,offers,top,profit,rate:profit/(top.paid+top.ship)});
  }
  const key={profit:r=>-r.profit,rate:r=>-r.rate,buy:r=>-r.best.p}[S.sort];
  rows.sort((a,b)=>key(a)-key(b));
  return rows;
}

function render(){
  if(!DATA)return;
  const rows=compute();
  $('count').textContent=`${rows.length.toLocaleString()}件 / 全${DATA.items.length.toLocaleString()}件`;
  const L=DATA.sources;
  $('list').innerHTML=rows.length?rows.slice(0,shown).map(r=>{
    const {it,top,best}=r,o=top.o;
    const chips=r.buys.sort((a,b)=>b.p-a.p).map(b=>`<a class="chip ${b===best?'best':''}" href="${esc(b.u)}" target="_blank" rel="noopener">${esc(L[b.k].label)} ${yen(b.p)}</a>${b.note?`<span class="chip warn">${esc(b.note)}</span>`:''}`).join('');
    const others=r.offers.map(e=>`<tr><td><a href="${esc(e.o.u)}" target="_blank" rel="noopener">${esc(e.o.s)}</a>${e.o.bs?' ★':''}</td><td>${yen(e.base)}</td><td>${e.cp?'-'+yen(e.cp):'—'}</td><td>${e.o.sh===2?'無料':'+'+yen(e.ship)}</td><td>${e.pts.toLocaleString()}P</td><td><b>${yen(e.eff)}</b></td><td class="${best.p-e.eff-S.sendCost>=0?'plus':'minus'}">${yen(best.p-e.eff-S.sendCost)}</td></tr>`).join('');
    const pc=r.profit>=0?'plus':'minus';
    return `<article class="item">
      ${o.img?`<img src="${esc(o.img)}" alt="" loading="lazy">`:'<div></div>'}
      <div>
        <div class="name">${esc(it.name)}</div>
        <div class="jan" title="クリックでコピー" data-jan="${it.jan}">JAN ${it.jan}</div>
        <div class="chips">${chips}</div>
        <div class="offer">Yahoo最安(実質): <a href="${esc(o.u)}" target="_blank" rel="noopener">${esc(o.s)}</a>${o.bs?' ★優良':''} ${yen(top.base)}${top.cp?` − クーポン${yen(top.cp)}`:''}${top.ship?` ＋送料${yen(top.ship)}`:''} − ${top.pts.toLocaleString()}P
          <div class="calc">ストアP ${top.storePt.toLocaleString()} ＋ 還元 ${top.userPt.toLocaleString()} ／ Yahoo確認 ${esc(it.at.slice(5,16).replace('T',' '))}</div></div>
      </div>
      <div class="profit">
        <div class="v ${pc}">${r.profit>=0?'+':''}${yen(r.profit)}</div>
        <div class="r">実質 ${yen(top.eff)} ・ ${(r.rate*100).toFixed(1)}%</div>
        <div><a class="buy" href="${esc(o.u)}" target="_blank" rel="noopener">Yahooで見る</a></div>
      </div>
      <details><summary>出品${r.offers.length}件を比較</summary>
        <table><tr><th>ストア</th><th>価格</th><th>クーポン</th><th>送料</th><th>ポイント</th><th>実質</th><th>差額</th></tr>${others}</table>
      </details>
    </article>`}).join(''):'<div class="empty panel">条件に合う商品がありません。還元率や絞り込みを見直してください。</div>';
  $('more').hidden=rows.length<=shown;
}

function renderMeta(){
  const parts=[`更新 ${DATA.updated.replace('T',' ').slice(0,16)}`];
  for(const [k,s] of Object.entries(DATA.sources)){
    parts.push(`${esc(s.label)} ${s.count?s.count.toLocaleString()+'件':'—'}${s.error?` <span class="err" title="${esc(s.error)}">⚠取得失敗</span>`:''}`);
  }
  $('meta').innerHTML=parts.map(p=>`<span>${p}</span>`).join('');
  $('srcBoxes').innerHTML=Object.entries(DATA.sources).map(([k,s])=>`<label><input type="checkbox" value="${k}"> ${esc(s.label)}</label>`).join('');
}

document.addEventListener('input',e=>{if(e.target.closest('#settings'))readForm()});
document.addEventListener('change',e=>{if(e.target.closest('#settings'))readForm()});
$('sortBtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.sort=b.dataset.sort;store.set(S);syncForm();shown=100;render()});
$('more').onclick=()=>{shown+=100;render()};
$('reset').onclick=()=>{S={...DEFAULTS};store.set(S);syncForm();render()};
$('theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
$('list').addEventListener('click',e=>{const j=e.target.closest('.jan');if(j){navigator.clipboard&&navigator.clipboard.writeText(j.dataset.jan);j.textContent='コピーしました';setTimeout(()=>j.textContent='JAN '+j.dataset.jan,1000)}});

fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;renderMeta();syncForm();render()})
  .catch(()=>{$('meta').textContent='data.json を読み込めませんでした';});
</script>
</body>
</html>
