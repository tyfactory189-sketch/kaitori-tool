name: 価格データ更新

on:
  schedule:
    # 日本時間 3:07 / 9:07 / 15:07 / 21:07（UTCで書く）
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      skip_buyback:
        description: "買取サイトの取得を飛ばす（Yahooだけ更新）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Yahooの照合結果はリポジトリに入れず、Actionsのキャッシュに置く（履歴が膨らまないように）
      - name: Yahoo照合キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: |
            data/yahoo_cache.json
            data/rakuten_cache.json
            data/amazon_cache.json
          key: yahoo-cache-${{ github.run_id }}
          restore-keys: yahoo-cache-

      - name: 取得と集計
        env:
          YAHOO_APPID: ${{ secrets.YAHOO_APPID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          MIN_BUY: ${{ vars.MIN_BUY || '2000' }}
          YAHOO_BUDGET_MIN: ${{ vars.YAHOO_BUDGET_MIN || '300' }}
        run: |
          if [ "${{ inputs.skip_buyback }}" = "true" ]; then
            python run.py --skip-buyback
          else
            python run.py --sources shouten,kaikyo,earth
          fi

      - name: Yahoo照合キャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/yahoo_cache.json
            data/rakuten_cache.json
            data/amazon_cache.json
          key: yahoo-cache-${{ github.run_id }}

      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached -q --ignore-unmatch data/yahoo_cache.json data/rakuten_cache.json data/amazon_cache.json
          for f in data/status.json data/run_log.json data/buyback_shouten.json data/buyback_kaikyo.json data/buyback_earth.json; do git add -- "$f" 2>/dev/null || true; done
          for f in docs/data.json docs/data.enc.json; do git add -A -- "$f" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git commit -q -m "価格データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 実行中にブックマークから買取データが保存されていても取り込んでから送る
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 10
          done
          exit 1
